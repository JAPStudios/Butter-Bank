name: Repository tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  emberchain:
    name: Emberchain unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r emberchain/requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: emberchain

  android:
    name: Android debug build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug testDebugUnitTest
