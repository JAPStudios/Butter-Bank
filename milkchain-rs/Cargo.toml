[package]
name = "milkchain"
version = "0.1.0"
edition = "2021"
description = "Milkchain deterministic account ledger and weighted Byzantine commit verifier"
license = "MIT"

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
rand = "0.8"
tempfile = "3"
